<header id="header">
	<h1 style="top: 5px"><a href="{% link index.html %}"><img src="/assets/logos/Understory_logo_ primary_ white.png" alt="Understory logo" style="height: 20px; width: auto"/></a></h1>
	<nav id="nav">
		<ul>
			<li class="special">
				<a href="#menu" class="menuToggle"><span>Menu</span></a>
				<div id="menu">
					<ul>
						{%- for navlink in site.data.navigation -%}
						<li>
							<a href="{% link {{ navlink.pagelink }} %}">
								<h3>{{ navlink.title }}</h3>
							</a>
						</li>
						{%- endfor -%}
					</ul>
				</div>
			</li>
		</ul>
	</nav>
</header>
